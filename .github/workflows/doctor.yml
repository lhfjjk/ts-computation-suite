name: doctor

on:
  push:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run environment check and parser self-tests
        run: python scripts/doctor.py
      - name: Documentation consistency gate
        run: python scripts/check_docs.py --verbose
